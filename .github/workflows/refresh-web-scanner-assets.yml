name: Refresh Web Scanner Assets

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force a rebuild even if the HF catalog fingerprint is unchanged
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "collector_vision/data/model_registry.json"
      - "collector_vision/model_*.py"
      - "scripts/export_web_scanner_assets.py"
      - "examples/web_scanner/assets.bundle.json"
      - "examples/web_scanner/assets.testing.bundle.json"
  schedule:
    - cron: "17 8 1 * *"

permissions:
  actions: write
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle_channel: stable
            pointer_path: examples/web_scanner/assets.bundle.json
            deploy_pages: true
          - bundle_channel: testing
            pointer_path: examples/web_scanner/assets.testing.bundle.json
            deploy_pages: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install project
        run: uv pip install --system -e ".[hf]"

      - name: Resolve bundle target
        id: bundle
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          pointer = json.loads(Path("${{ matrix.pointer_path }}").read_text(encoding="utf-8"))
          catalog_key = pointer["catalog_key"]
          if not catalog_key.startswith("hf://"):
              raise SystemExit(f"Unsupported catalog key: {catalog_key}")
          rest = catalog_key[len("hf://"):]
          owner, repo, key = rest.split("/", 2)
          print(f"release={pointer['release']}")
          print(f"catalog_uri={catalog_key}")
          print(f"repo={owner}/{repo}")
          print(f"catalog_key_name={key}")
          print(f"model_channel={pointer.get('model_channel', 'stable')}")
          print(f"corner_detector_family={pointer.get('corner_detector_family', 'cornelius')}")
          print(f"corner_detector_version={pointer.get('corner_detector_version', '')}")
          PY

      - name: Resolve upstream fingerprint
        id: upstream
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import urllib.request

          from collector_vision.model_registry import load_model_registry

          repo = "${{ steps.bundle.outputs.repo }}"
          catalog_key = "${{ steps.bundle.outputs.catalog_key_name }}"
          url = f"https://huggingface.co/{repo}/resolve/main/catalogs/manifest.json"
          with urllib.request.urlopen(url, timeout=30) as response:
              manifest = json.loads(response.read().decode("utf-8"))
          latest = manifest[catalog_key]["latest"]
            detector = load_model_registry().get_model(
              family="${{ steps.bundle.outputs.corner_detector_family }}",
              version="${{ steps.bundle.outputs.corner_detector_version }}" or None,
              channel="${{ steps.bundle.outputs.model_channel }}",
            )
          print(f"catalog_filename={latest}")
          print(f"bundle_version={latest.rsplit('.', 1)[0]}")
            print(f"detector_id={detector.id}")
            print(f"detector_sha256=sha256:{detector.sha256}")
          PY

      - name: Download current release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release
          gh release download "${{ steps.bundle.outputs.release }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "web-scanner-assets-metadata.json" \
            --dir .release || true

      - name: Decide whether refresh is needed
        id: decision
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          force = "${{ inputs.force }}" == "true" or "${{ github.event_name }}" == "push"
          metadata_path = Path(".release/web-scanner-assets-metadata.json")
            current_catalog = None
            current_detector_id = None
            current_detector_hash = None
          if metadata_path.exists():
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              current_catalog = metadata.get("catalog_fingerprint")
              current_detector_id = metadata.get("model_ids", {}).get("detector")
              current_detector_hash = metadata.get("models", {}).get("detector")
          upstream = "${{ steps.upstream.outputs.catalog_filename }}"
            detector_id = "${{ steps.upstream.outputs.detector_id }}"
            detector_hash = "${{ steps.upstream.outputs.detector_sha256 }}"
            refresh = force or current_catalog != upstream or current_detector_id != detector_id or current_detector_hash != detector_hash
          print(f"refresh={'true' if refresh else 'false'}")
            print(f"current={current_catalog or ''}")
          PY

      - name: Skip unchanged bundle
        if: steps.decision.outputs.refresh != 'true'
        run: |
          echo "Prepared asset bundle is already current."
          echo "Current fingerprint: ${{ steps.decision.outputs.current }}"
          echo "Upstream fingerprint: ${{ steps.upstream.outputs.catalog_filename }}"

      - name: Export bundle
        if: steps.decision.outputs.refresh == 'true'
        run: |
          rm -rf .web-scanner-build
          python scripts/export_web_scanner_assets.py \
            --repo "${{ steps.bundle.outputs.repo }}" \
            --catalog-key "${{ steps.bundle.outputs.catalog_key_name }}" \
            --bundle-version "${{ steps.upstream.outputs.bundle_version }}" \
            --model-channel "${{ steps.bundle.outputs.model_channel }}" \
            --corner-detector-family "${{ steps.bundle.outputs.corner_detector_family }}" \
            --out-dir .web-scanner-build

      - name: Package bundle
        if: steps.decision.outputs.refresh == 'true' && matrix.deploy_pages
        run: |
          tar --zstd -cf web-scanner-assets.tar.zst -C .web-scanner-build assets vendor bundle-metadata.json
          cp .web-scanner-build/bundle-metadata.json web-scanner-assets-metadata.json

      - name: Publish release assets
        if: steps.decision.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.bundle.outputs.release }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${{ steps.bundle.outputs.release }}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Web Scanner Assets" \
              --notes "Prepared asset bundle for the GitHub Pages scanner."
          gh release upload "${{ steps.bundle.outputs.release }}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            web-scanner-assets.tar.zst \
            web-scanner-assets-metadata.json

      - name: Trigger Pages deploy
        if: steps.decision.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY"
