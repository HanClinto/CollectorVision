name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "examples/web_scanner/**"
  schedule:
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prepared stable and testing scanner assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STABLE_RELEASE="$(python - <<'PY'
          import json
          with open("examples/web_scanner/assets.bundle.json", "r", encoding="utf-8") as f:
              print(json.load(f)["release"])
          PY
          )"
          TESTING_RELEASE="$(python - <<'PY'
          import json
          with open("examples/web_scanner/assets.testing.bundle.json", "r", encoding="utf-8") as f:
              print(json.load(f)["release"])
          PY
          )"
          mkdir -p /tmp/web-scanner-assets/stable /tmp/web-scanner-assets/testing
          gh release download "$STABLE_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "web-scanner-assets.tar.zst" \
            --pattern "web-scanner-assets-metadata.json" \
            --dir /tmp/web-scanner-assets/stable
          if gh release view "$TESTING_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$TESTING_RELEASE" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "web-scanner-assets.tar.zst" \
              --pattern "web-scanner-assets-metadata.json" \
              --dir /tmp/web-scanner-assets/testing
          else
            echo "Testing asset release is not published yet; deploying stable assets only."
          fi
          rm -rf examples/web_scanner/assets examples/web_scanner/vendor examples/web_scanner/bundle-metadata.json examples/web_scanner/testing
          tar --zstd -xf /tmp/web-scanner-assets/stable/web-scanner-assets.tar.zst -C examples/web_scanner
          if [[ -f /tmp/web-scanner-assets/testing/web-scanner-assets.tar.zst ]]; then
            mkdir -p examples/web_scanner/testing
            tar --zstd -xf /tmp/web-scanner-assets/testing/web-scanner-assets.tar.zst \
              -C examples/web_scanner/testing assets bundle-metadata.json
          fi

      - name: Mirror Catalog v2 client assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASES="$(gh release list \
            --repo HanClinto/CollectorVisionCatalog \
            --limit 1000 \
            --json tagName,isDraft,isPrerelease)"
          CATALOG_V2_RELEASE="$(RELEASES="$RELEASES" python - <<'PY'
          import json
          import os
          import re
          from datetime import date

          pattern = re.compile(
              r"^catalog-v2-beta\.([1-9][0-9]*)-(\d{4}-\d{2}-\d{2})$"
          )
          with open("examples/web_scanner/catalog-v2.release.json", "r", encoding="utf-8") as f:
             minimum = json.load(f)["minimum_release"]
          minimum_match = pattern.fullmatch(minimum)
          if minimum_match is None:
             raise SystemExit(f"Invalid minimum Catalog v2 release: {minimum}")
          try:
             minimum_identity = (
                 int(minimum_match.group(1)),
                 date.fromisoformat(minimum_match.group(2)),
             )
          except ValueError as error:
             raise SystemExit(f"Invalid minimum Catalog v2 release: {minimum}") from error
          releases = json.loads(os.environ["RELEASES"])
          candidates = []
          for release in releases:
             match = pattern.fullmatch(release["tagName"])
             if release["isDraft"] or not release["isPrerelease"] or match is None:
                 continue
             try:
                 source_date = date.fromisoformat(match.group(2))
             except ValueError:
                 continue
             candidates.append(
                 (int(match.group(1)), source_date, release["tagName"])
             )
          if not candidates:
             raise SystemExit("No published Catalog v2 beta release found")
          number, source_date, latest = max(candidates)
          if (number, source_date) < minimum_identity:
             raise SystemExit(
                 f"Latest Catalog v2 release {latest} precedes required {minimum}"
             )
          print(latest)
          PY
          )"
          rm -rf examples/web_scanner/catalog-v2
          mkdir -p examples/web_scanner/catalog-v2
          if ! curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/HanClinto/CollectorVisionCatalog/main/catalog-feed-v2.json \
            --output examples/web_scanner/catalog-v2/catalog-feed-v2.json; then
            if gh release download "$CATALOG_V2_RELEASE" \
              --repo HanClinto/CollectorVisionCatalog \
              --pattern "catalog-feed-v2.json" \
              --dir examples/web_scanner/catalog-v2; then
              echo "Using immutable release feed fallback"
            else
            CATALOG_V2_DIR="examples/web_scanner/catalog-v2/$CATALOG_V2_RELEASE"
            mkdir -p "$CATALOG_V2_DIR"
            gh release download "$CATALOG_V2_RELEASE" \
              --repo HanClinto/CollectorVisionCatalog \
              --pattern "catalog-index-v2.json" \
              --dir "$CATALOG_V2_DIR"
            CATALOG_V2_RELEASE="$CATALOG_V2_RELEASE" python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["CATALOG_V2_RELEASE"]
          root = Path("examples/web_scanner/catalog-v2")
          index = json.loads((root / version / "catalog-index-v2.json").read_text())
          feed = {
              "schema_version": 2,
              "release_version": version,
              "catalogs": {
                  key: {
                      "base": {
                          "version": version,
                          "manifest_filename": entry["manifest_filename"],
                          "sha256": entry["sha256"],
                      },
                      "deltas": [],
                  }
                  for key, entry in index["catalogs"].items()
              },
          }
          (root / "catalog-feed-v2.json").write_text(
              json.dumps(feed, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY
            fi
          fi

          declare -A CATALOG_V2_ROLES
          while IFS=$'\t' read -r version role; do
            existing="${CATALOG_V2_ROLES[$version]:-}"
            if [ -n "$existing" ] && [ "$existing" != "$role" ]; then
              CATALOG_V2_ROLES[$version]="both"
            else
              CATALOG_V2_ROLES[$version]="$role"
            fi
          done < <(python - <<'PY'
          import json

          with open("examples/web_scanner/catalog-v2/catalog-feed-v2.json") as stream:
              feed = json.load(stream)
          for entry in feed["catalogs"].values():
              print(entry["base"]["version"], "full", sep="\t")
              for delta in entry["deltas"]:
                  print(delta["to"], "delta", sep="\t")
          PY
          )

          for version in "${!CATALOG_V2_ROLES[@]}"; do
            role="${CATALOG_V2_ROLES[$version]}"
            destination="examples/web_scanner/catalog-v2/$version"
            mkdir -p "$destination"
            gh release download "$version" \
              --repo HanClinto/CollectorVisionCatalog \
              --clobber \
              --pattern "catalog-index-v2.json" \
              --pattern "*.manifest.json" \
              --dir "$destination"
            if [ "$role" = "full" ] || [ "$role" = "both" ]; then
              gh release download "$version" \
                --repo HanClinto/CollectorVisionCatalog \
                --clobber \
                --pattern "*.recognition.*.gz" \
                --pattern "*.metadata.jsonl.gz" \
                --dir "$destination"
            fi
            if [ "$role" = "delta" ] || [ "$role" = "both" ]; then
              gh release download "$version" \
                --repo HanClinto/CollectorVisionCatalog \
                --clobber \
                --pattern "*.delta.*.gz" \
                --dir "$destination"
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stamp build ID
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          sed -i "s/__BUILD_ID__/${SHORT_SHA}/g" examples/web_scanner/app.js
          sed -i "s/__BUILD_ID__/${SHORT_SHA}/g" examples/web_scanner/index.html
          sed -i "s/__BUILD_ID__/${SHORT_SHA}/g" examples/web_scanner/applet_example.html
          sed -i "s/__BUILD_ID__/${SHORT_SHA}/g" examples/web_scanner/screen_capture_monitor.html
          sed -i "s/__BUILD_ID__/${SHORT_SHA}/g" examples/web_scanner/screen_capture_monitor.js
          sed -i "s/__BUILD_ID__/${SHORT_SHA}/g" examples/web_scanner/screen_capture_overlay.html
          sed -i "s/__BUILD_ID__/${SHORT_SHA}/g" examples/web_scanner/build.json
          echo "Stamped build ID: ${SHORT_SHA}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/web_scanner

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
